# Unsignalized 4-way crossroad; ego must turn left through cross-traffic.
scenario: intersection
env_id: intersection-v0
seed: 42
max_episode_steps: null  # env truncates itself after `duration` seconds

env_config:
  observation:
    type: Kinematics
    vehicles_count: 15            # ego + 14 nearest vehicles
    features: [presence, x, y, vx, vy, cos_h, sin_h]
    features_range: {x: [-100, 100], y: [-100, 100], vx: [-20, 20], vy: [-20, 20]}
    absolute: true
    flatten: false
    observe_intentions: false
  action:
    type: DiscreteMetaAction
    longitudinal: true
    lateral: false                # route is fixed; agent only controls speed
    target_speeds: [0, 4.5, 9]    # m/s
  duration: 13                    # seconds (= policy steps at 1 Hz)
  destination: o1                 # left turn
  simulation_frequency: 15
  policy_frequency: 1
  initial_vehicle_count: 10
  spawn_probability: 0.6
  collision_reward: -5
  high_speed_reward: 1
  arrived_reward: 1
  reward_speed_range: [7.0, 9.0]
  normalize_reward: false

ppo:
  learning_rate: 3.0e-4
  n_steps: 256                    # per env -> 1024 samples/update with 4 envs
  batch_size: 64
  n_epochs: 10
  gamma: 0.95                     # short episodes, so a short horizon is enough
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  policy_kwargs: {net_arch: [256, 256]}

train:
  total_timesteps: 20000
  n_envs: 4

eval:
  n_episodes: 50
  seed_offset: 10000              # eval seeds never overlap training seeds
