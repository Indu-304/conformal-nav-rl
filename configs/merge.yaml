# Highway on-ramp merge; ego drives on the main road while a ramp vehicle merges in.
scenario: merge
env_id: merge-v0
seed: 42
max_episode_steps: 40  # merge-v0 never truncates on its own

env_config:
  observation:
    type: Kinematics
    vehicles_count: 10
    features: [presence, x, y, vx, vy, cos_h, sin_h]
    absolute: false
    normalize: true
  action:
    type: DiscreteMetaAction    # LANE_LEFT, IDLE, LANE_RIGHT, FASTER, SLOWER
  simulation_frequency: 15
  policy_frequency: 1
  collision_reward: -1
  right_lane_reward: 0.1
  high_speed_reward: 0.2
  reward_speed_range: [20, 30]
  merging_speed_reward: -0.5
  lane_change_reward: -0.05

ppo:
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  policy_kwargs: {net_arch: [256, 256]}

train:
  total_timesteps: 20000
  n_envs: 4

eval:
  n_episodes: 50
  seed_offset: 10000
