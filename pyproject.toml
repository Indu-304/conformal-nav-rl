[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-nav-rl"
version = "0.1.0"
description = "Safe RL for intersections and highway merging with conformal safety shields."
requires-python = ">=3.10,<3.14"  # pygame (highway-env dep) has no wheels for newer Pythons
dependencies = [
    "gymnasium>=1.0,<1.2",
    "highway-env>=1.10,<1.11",
    "stable-baselines3>=2.4,<3",
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
